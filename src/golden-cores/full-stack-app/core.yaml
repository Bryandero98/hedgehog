# Shipped core definition for full-stack-app. Layer order, scope, and
# verify commands are the same shape src/skills/hedgehog-loop's Domain
# Module step tables describe in prose — this file is their data form.
# {module} is filled in by the compiler with the domain module name a
# task is generated for.
#
# Every per-module layer's scope carries {module} — module-disjoint by
# construction, so two modules' tasks never touch the same file
# (src/db/core.mjs's validateCore enforces this: a module-axis core
# rejects any non-exclusive layer whose scope omits {module}). schema and
# hook declare a verify_radius wider than their scope: `nx test
# db`/`nx test hooks` typecheck the whole package's tsconfig.lib.json
# regardless of test filter (tsc has no per-module isolation — confirmed
# against a real Nx run), so two modules' schema tasks correctly
# serialize against each other on that radius while a schema task and an
# unrelated module's repository task still run together. join is
# exclusive: true and scoped to everything — the declared escape hatch
# for irreducibly global work, and the honest admission that cross-module
# type/integration breakage isn't caught at the task that caused it once
# schema/hook run per-module; join catches it once, after every module's
# layers land, in exchange for those layers running in parallel.
id: full-stack-app
layers:
  - id: schema
    scope: ["packages/db/src/schema/{module}/**"]
    verify: "pnpm nx test db -- src/schema/{module}/"
    verify_radius: ["packages/db/**"]
    commit: "feat({module}): schema"
  - id: contract
    depends_on: schema
    scope: ["packages/contracts/src/{module}/**"]
    verify: "pnpm nx test contracts -- src/{module}/"
    commit: "feat({module}): contract"
  - id: repository
    depends_on: contract
    scope: ["libs/{module}/repository/**"]
    verify: "pnpm nx test {module}-repository"
    commit: "feat({module}): repository"
  - id: service
    depends_on: repository
    scope: ["libs/{module}/service/**"]
    verify: "pnpm nx test {module}-service"
    commit: "feat({module}): service"
  - id: controller
    depends_on: service
    scope: ["apps/api/src/app/{module}/**"]
    verify: "pnpm nx test api -- src/app/{module}/"
    commit: "feat({module}): api"
  - id: hook
    depends_on: controller
    scope: ["packages/hooks/src/{module}/**"]
    verify: "pnpm nx test hooks -- src/{module}/"
    verify_radius: ["packages/hooks/**"]
    commit: "feat({module}): hooks"
  - id: screen
    depends_on: hook
    scope: ["apps/web/src/app/{module}/**", "apps/mobile/src/{module}/**"]
    verify: "pnpm nx test web -- src/app/{module}/ && pnpm nx test mobile -- src/{module}/"
    commit: "feat({module}): screen-web"
  - id: join
    depends_on: screen
    scope: ["**"]
    verify: "pnpm nx run-many -t typecheck && pnpm nx run-many -t test"
    exclusive: true
    commit: "chore({module}): join"
